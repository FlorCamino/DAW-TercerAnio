<div class="projects-container">
  <div class="form-card">
    <h1>Editar proyecto</h1>
    @if (project()) {
      <app-project-form
        [initialData]="project()"
        submitLabel="Guardar cambios"
        (formSubmit)="onSubmit($event)"
      >
        <a [routerLink]="['/projects', id]" class="secondary-button">Cancelar</a>
      </app-project-form>
    } @else {
      <p>Cargando...</p>
    }
  </div>
</div>

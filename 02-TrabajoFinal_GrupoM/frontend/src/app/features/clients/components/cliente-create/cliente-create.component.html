<main class="client-create-page">
  <section class="client-create-panel">
    <div class="client-create-header">
      <h1>Nuevo cliente</h1>
      <p>Completa los datos principales para registrar un cliente.</p>
    </div>

    <div class="form-grid">
      <label>
        Nombre
        <input [(ngModel)]="cliente.nombre" placeholder="Nombre del cliente" />
      </label>

      <label>
        Email
        <input [(ngModel)]="cliente.email" placeholder="correo@ejemplo.com" />
      </label>

      <label>
        Telefono
        <input [(ngModel)]="cliente.telefono" placeholder="Ej: 123456789" inputmode="numeric" minlength="7"
          maxlength="15" pattern="[0-9]{7,15}" />
      </label>
    </div>

    <p class="form-error" *ngIf="error">{{ error }}</p>

    <div class="form-actions">
      <button class="primary-button" (click)="guardar()">Guardar</button>
      <a class="secondary-button" routerLink="/clientes">Cancelar</a>
    </div>
  </section>
</main>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-haeder-block">
        <h2>Iniciar Sesión</h2>
        <p class="subtitle">Ingresa tus datos para iniciar sesión</p>
        </div>

        <form (ngSubmit)="iniciarSesion()" class="project-form">
            <div class="field-control">
                <label for="seed-user">Usuario de prueba</label>
                <select
                    id="seed-user"
                    name="seedUser"
                    [ngModel]="usuarioSeleccionado"
                    (ngModelChange)="seleccionarUsuario($event)">
                    <option value="">Seleccionar usuario</option>
                    <option *ngFor="let usuario of usuariosSeed" [value]="usuario.nombre">
                        {{ usuario.label }}
                    </option>
                </select>
            </div>

            <div class="field-control">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="nombre"
                    [(ngModel)]="credenciales.nombre"
                    placeholder="Ejemplo: micazalazar"
                    required>
            </div>

            <div class="field-control">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="clave"
                    [(ngModel)]="credenciales.clave"
                    placeholder="******"
                    required>
            </div>

            <div *ngIf="errorMessage" class="auth-error-alert">
                <i class="pi pi-exclamation-circle"></i>{{ errorMessage }}
            </div>

            <div class="auth-action-row">
                <button type="submit" [disabled]="loading" class="btn-login-submit">
                    {{ loading ? "Cargando..." : "Ingresar" }}
                </button>
            </div>
        </form>
    </div>
</div>

<header class="topbar">
  <div class="topbar-main">
    <a class="brand" routerLink="/" aria-label="Ir al panel principal" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span>Grupo M</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Abrir menú" [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()">
      <i class="pi" [class.pi-bars]="!menuOpen" [class.pi-times]="menuOpen" aria-hidden="true"></i>
    </button>
  </div>

  <nav class="main-nav" [class.open]="menuOpen" aria-label="Menú principal">

    <a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="dashboardLinkOptions"
      (click)="closeMenu()">
      <i class="pi pi-chart-line" aria-hidden="true"></i>
      <span>Dashboard</span>
    </a>

    <a routerLink="/tareas" routerLinkActive="active-link" [routerLinkActiveOptions]="sectionLinkOptions"
      (click)="closeMenu()">
      <i class="pi pi-check-square" aria-hidden="true"></i>
      <span>Tareas</span>
    </a>

    <a routerLink="/projects" routerLinkActive="active-link" [routerLinkActiveOptions]="sectionLinkOptions"
      (click)="closeMenu()">
      <i class="pi pi-briefcase" aria-hidden="true"></i>
      <span>Proyectos</span>
    </a>

    <a routerLink="/clientes" routerLinkActive="active-link" [routerLinkActiveOptions]="sectionLinkOptions"
      (click)="closeMenu()">
      <i class="pi pi-address-book" aria-hidden="true"></i>
      <span>Clientes</span>
    </a>

    <a routerLink="/usuarios" routerLinkActive="active-link" [routerLinkActiveOptions]="sectionLinkOptions" (click)="closeMenu()">
      <i class="pi pi-users" aria-hidden="true"></i>
      <span>Usuarios</span>
    </a>

    <div class="nav-user-info">
      <span class="nav-user-name">{{ nombreUsuario }}</span>
      <span class="nav-user-role">{{ rolUsuario }}</span>
    </div>

    <button class="logout-link" type="button" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="logout()">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
  </nav>
</header>
